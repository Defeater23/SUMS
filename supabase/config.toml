# Supabase CLI configuration for SUMS.
# Only the values that matter for local development and migrations are set;
# hosting-specific settings are managed in the Supabase dashboard.

project_id = "sums"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15
shadow_port = 54320

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.rate_limit]
email_sent = 30
token_verifications = 30

[storage]
enabled = true
file_size_limit = "5MiB"

[functions.notify-booking]
verify_jwt = false
